{{ $featuredImage := .Param "featured_image" }}
<header{{ if $featuredImage }} class="cover bg-top" style="background-image: url('{{ $featuredImage | absURL }}');"{{ end }}>
  <div class="{{ if $featuredImage }}{{ .Site.Params.cover_dimming_class | default "bg-black-60" }}{{ else }}{{ .Site.Params.background_color_class | default "bg-black" }}{{ end }}">
    {{ partial "site-navigation.html" . }}
    <div class="tc-l pv4 pv6-l ph3 ph4-ns">
      <h1 class="f2 f-subheadline-l fw2 white mb0 lh-title">{{ .Title | default .Site.Title }}</h1>
      {{ with .Params.description }}<p class="fw1 f5 f3-l white measure-wide-l center lh-copy mt3 mb4">{{ . }}</p>{{ end }}
    </div>
  </div>
</header>
