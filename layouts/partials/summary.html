<article class="relative w-100 mb4 bg-white nested-copy-line-height">
  <div class="bg-white mb3 pa4 dark-gray overflow-hidden">
    <span class="f6 db">{{ humanize .Section }}</span>
    <h2 class="f3 near-black">
      <a href="{{ .Permalink }}" class="link black dim">{{ .Title }}</a>
    </h2>
    {{ if not .Date.IsZero }}<time class="f6 db mb3" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ end }}
    <p class="f5 lh-copy">{{ partial "card-excerpt.html" . }}</p>
  </div>
</article>
