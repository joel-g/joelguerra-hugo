{{ $featuredImage := .Params.featured_image }}
{{ if $featuredImage }}
  <header class="cover bg-top" style="background-image: url('{{ $featuredImage | absURL }}');">
    <div class="pb3-m pb6-l bg-black-60">
      {{ partial "site-navigation.html" . }}
      <div class="pv5 pv6-l" aria-hidden="true"></div>
    </div>
  </header>
{{ else }}
  <header><div class="{{ .Site.Params.background_color_class | default "bg-black" }}">{{ partial "site-navigation.html" . }}</div></header>
{{ end }}
